server {
    listen       80;
    server_name  _;
    root   /usr/share/nginx/html;
    index  index.html;

    # Runtime config is regenerated per deploy — never cache it.
    location = /config.js {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    # Hashed assets are immutable — cache them hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback: every unknown path serves index.html so React Router works.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
